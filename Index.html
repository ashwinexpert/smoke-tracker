<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Smoke Tracker Pro</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: Arial, sans-serif;
      min-height: 100vh;
      background:
        radial-gradient(circle at top left, #2d5bff33, transparent),
        radial-gradient(circle at bottom right, #ff174433, transparent),
        #081126;
      color: white;
      padding: 20px;
    }

    .container {
      max-width: 500px;
      margin: auto;
    }

    .title {
      text-align: center;
      margin-bottom: 20px;
    }

    .title h1 {
      font-size: 38px;
      margin-bottom: 5px;
    }

    .title p {
      opacity: 0.7;
    }

    .glass {
      background: rgba(255,255,255,0.08);
      border: 1px solid rgba(255,255,255,0.08);
      backdrop-filter: blur(15px);
      border-radius: 22px;
      padding: 20px;
      margin-bottom: 20px;
      box-shadow: 0 0 20px rgba(0,0,0,0.25);
    }

    .count {
      text-align: center;
      font-size: 80px;
      font-weight: bold;
      margin: 20px 0;
      transition: 0.3s;
    }

    .safe {
      color: #00e676;
    }

    .warning {
      color: #ff9800;
    }

    .danger {
      color: #ff1744;
    }

    .buttons {
      display: flex;
      gap: 12px;
      margin-top: 15px;
    }

    button {
      flex: 1;
      border: none;
      padding: 15px;
      border-radius: 16px;
      color: white;
      font-size: 18px;
      cursor: pointer;
      transition: 0.2s;
    }

    button:hover {
      transform: scale(1.03);
    }

    .green {
      background: #00c853;
    }

    .orange {
      background: #ff9800;
    }

    .red {
      background: #ff1744;
    }

    .stats-grid {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 15px;
    }

    .stat-card {
      background: rgba(255,255,255,0.05);
      padding: 15px;
      border-radius: 16px;
      text-align: center;
    }

    .stat-card h2 {
      font-size: 28px;
      margin-top: 10px;
    }

    .timeline {
      max-height: 260px;
      overflow-y: auto;
    }

    .timeline-item {
      padding: 12px;
      border-bottom: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    .small {
      opacity: 0.6;
      font-size: 13px;
    }

    canvas {
      margin-top: 10px;
    }

    .footer {
      text-align: center;
      opacity: 0.5;
      margin-top: 20px;
      font-size: 13px;
    }

    input {
      width: 100%;
      margin-top: 12px;
      padding: 12px;
      border-radius: 12px;
      border: none;
      background: rgba(255,255,255,0.08);
      color: white;
      font-size: 16px;
    }

  </style>
</head>

<body>

  <div class="container">

    <div class="title">
      <h1>🚬 Smoke Tracker Pro</h1>
      <p id="todayDate"></p>
    </div>

    <div class="glass">

      <div id="count" class="count safe">0</div>

      <div class="buttons">
        <button class="green" onclick="addSmoke(1)">+1</button>
        <button class="orange" onclick="addSmoke(0.5)">+0.5</button>
        <button class="red" onclick="resetToday()">Reset</button>
      </div>

      <input type="number" id="priceInput" placeholder="Price per cigarette ₹">

    </div>

    <div class="glass">

      <h2>📊 Analytics</h2>

      <div class="stats-grid">

        <div class="stat-card">
          <div>Today's Total</div>
          <h2 id="todayTotal">0</h2>
        </div>

        <div class="stat-card">
          <div>Weekly Avg</div>
          <h2 id="weeklyAvg">0</h2>
        </div>

        <div class="stat-card">
          <div>Money Today</div>
          <h2 id="moneyToday">₹0</h2>
        </div>

        <div class="stat-card">
          <div>Monthly Total</div>
          <h2 id="monthlyTotal">0</h2>
        </div>

      </div>

    </div>

    <div class="glass">

      <h2>📈 7 Day Trend</h2>

      <canvas id="trendChart"></canvas>

    </div>

    <div class="glass">

      <h2>⏱ Smoking Timeline</h2>

      <div class="timeline" id="timeline"></div>

    </div>

    <div class="footer">
      Smoke Tracker Pro • Local Device Storage
    </div>

  </div>

  <script>

    const todayDate = new Date().toLocaleDateString();

    document.getElementById("todayDate").innerText =
      new Date().toDateString();

    let smokeData =
      JSON.parse(localStorage.getItem("smokeTrackerData")) || {};

    let price =
      localStorage.getItem("cigPrice") || 0;

    document.getElementById("priceInput").value = price;

    if (!smokeData[todayDate]) {
      smokeData[todayDate] = {
        total: 0,
        entries: []
      };
    }

    function saveData() {
      localStorage.setItem(
        "smokeTrackerData",
        JSON.stringify(smokeData)
      );

      localStorage.setItem(
        "cigPrice",
        document.getElementById("priceInput").value
      );
    }

    function addSmoke(amount) {

      const now = new Date();

      smokeData[todayDate].total += amount;

      smokeData[todayDate].entries.unshift({
        amount,
        time: now.toLocaleTimeString()
      });

      saveData();

      updateUI();
    }

    function resetToday() {

      if (confirm("Reset today's data?")) {

        smokeData[todayDate] = {
          total: 0,
          entries: []
        };

        saveData();

        updateUI();
      }
    }

    function updateUI() {

      const todayTotal =
        smokeData[todayDate].total;

      const countEl =
        document.getElementById("count");

      countEl.innerText = todayTotal;

      countEl.className = "count";

      if (todayTotal <= 3) {
        countEl.classList.add("safe");
      }
      else if (todayTotal <= 7) {
        countEl.classList.add("warning");
      }
      else {
        countEl.classList.add("danger");
      }

      document.getElementById("todayTotal")
        .innerText = todayTotal;

      const pricePer =
        parseFloat(document.getElementById("priceInput").value || 0);

      document.getElementById("moneyToday")
        .innerText = "₹" + (todayTotal * pricePer).toFixed(1);

      updateTimeline();

      updateStats();

      updateChart();
    }

    function updateTimeline() {

      const timeline =
        document.getElementById("timeline");

      timeline.innerHTML = "";

      smokeData[todayDate].entries.forEach(entry => {

        timeline.innerHTML += `
          <div class="timeline-item">
            <div>
              <strong>+${entry.amount}</strong>
            </div>

            <div class="small">
              ${entry.time}
            </div>
          </div>
        `;
      });
    }

    function updateStats() {

      const dates =
        Object.keys(smokeData);

      let weeklyTotal = 0;

      let monthlyTotal = 0;

      dates.forEach(date => {

        weeklyTotal += smokeData[date].total;

        monthlyTotal += smokeData[date].total;
      });

      const weeklyAvg =
        (weeklyTotal / dates.length || 0).toFixed(1);

      document.getElementById("weeklyAvg")
        .innerText = weeklyAvg;

      document.getElementById("monthlyTotal")
        .innerText = monthlyTotal;
    }

    let chart;

    function updateChart() {

      const labels = [];
      const values = [];

      const dates =
        Object.keys(smokeData).slice(-7);

      dates.forEach(date => {

        labels.push(date);

        values.push(smokeData[date].total);
      });

      if (chart) {
        chart.destroy();
      }

      chart = new Chart(
        document.getElementById("trendChart"),
        {
          type: "line",

          data: {
            labels: labels,

            datasets: [{
              label: "Cigarettes",
              data: values,
              tension: 0.4
            }]
          },

          options: {
            plugins: {
              legend: {
                labels: {
                  color: "white"
                }
              }
            },

            scales: {
              x: {
                ticks: {
                  color: "white"
                }
              },

              y: {
                ticks: {
                  color: "white"
                }
              }
            }
          }
        }
      );
    }

    document.getElementById("priceInput")
      .addEventListener("input", () => {

        saveData();

        updateUI();
      });

    updateUI();

  </script>

</body>
</html>
