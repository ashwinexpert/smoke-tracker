
<!DOCTYPE html>
<html>

<head>
  <title>Smoke Tracker</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }

    .box {
      background: #1e293b;
      width: 300px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      font-size: 32px;
    }

    #count {
      font-size: 70px;
      margin: 20px 0;
      color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .add {
      background: #22c55e;
      color: white;
    }

    .half {
      background: orange;
      color: white;
    }

    .reset {
      background: red;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🚬 Smoke Tracker</h1>

    <div id="count">0</div>

    <button class="add" onclick="addOne()">
      +1 Cigarette
    </button>

    <button class="half" onclick="addHalf()">
      +0.5 Cigarette
    </button>

    <button class="reset" onclick="resetCount()">
      Reset Day
    </button>
  </div>

  <script type="module">

    import { initializeApp }
      from "https://www.gstatic.com/firebasejs/12.13.0/firebase-app.js";

    import {
      getFirestore,
      doc,
      getDoc,
      setDoc
    } from "https://www.gstatic.com/firebasejs/12.13.0/firebase-firestore.js";

    const firebaseConfig = {
      apiKey: "AIzaSyDHd4g6boJJE0pSqAAqBLkWZ_-ZuNgXDho",
      authDomain: "smoke-tracker-8c8f9.firebaseapp.com",
      projectId: "smoke-tracker-8c8f9",
      storageBucket: "smoke-tracker-8c8f9.firebasestorage.app",
      messagingSenderId: "640460140066",
      appId: "1:640460140066:web:4e54553f7dec30a0ba647b",
      measurementId: "G-RVS8Y7S6FY"
    };

    const app = initializeApp(firebaseConfig);

    const db = getFirestore(app);

    let count = 0;

    const countRef = doc(db, "tracker", "dailyCount");

    async function loadCount() {
      const snap = await getDoc(countRef);

      if (snap.exists()) {
        count = snap.data().count;
      }

      document.getElementById("count").innerText = count;
    }

    async function saveCount() {
      await setDoc(countRef, {
        count: count
      });

      document.getElementById("count").innerText = count;
    }

    window.addOne = async function () {
      count += 1;
      await saveCount();
    };

    window.addHalf = async function () {
      count += 0.5;
      await saveCount();
    };

    window.resetCount = async function () {
      count = 0;
      await saveCount();
    };

    loadCount();

  </script>

</body>

</html>
