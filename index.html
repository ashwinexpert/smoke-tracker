<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
    <title>Smoke Tracker Pro • Premium</title>
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        :root {
            --bg-gradient: linear-gradient(135deg, #0f172a 0%, #1e1b4b 100%);
            --glass-bg: rgba(255, 255, 255, 0.07);
            --glass-border: rgba(255, 255, 255, 0.1);
            --text: #f8fafc;
            --text-dim: rgba(255,255,255,0.6);
            --green: #10b981;
            --orange: #f59e0b;
            --red: #ef4444;
            --blue: #3b82f6;
            --purple: #8b5cf6;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.3);
        }

        body.light {
            --bg-gradient: linear-gradient(135deg, #e2e8f0 0%, #f1f5f9 100%);
            --glass-bg: rgba(255, 255, 255, 0.6);
            --glass-border: rgba(0, 0, 0, 0.05);
            --text: #0f172a;
            --text-dim: #475569;
            --card-shadow: 0 8px 32px rgba(0,0,0,0.08);
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: var(--bg-gradient);
            color: var(--text);
            min-height: 100vh;
            padding: 20px;
            transition: all 0.3s ease;
        }

        .container {
            max-width: 650px;
            margin: 0 auto;
        }

        .header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            flex-wrap: wrap;
            gap: 12px;
        }
        .header h1 {
            font-size: 28px;
            background: linear-gradient(135deg, #fff, #a78bfa);
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            background-clip: text;
        }
        .theme-btn {
            background: var(--glass-bg);
            border: 1px solid var(--glass-border);
            border-radius: 100px;
            padding: 10px 20px;
            cursor: pointer;
            color: var(--text);
            font-weight: 500;
            backdrop-filter: blur(10px);
            transition: 0.2s;
        }
        .date-badge {
            background: rgba(139, 92, 246, 0.2);
            padding: 6px 14px;
            border-radius: 100px;
            font-size: 14px;
            backdrop-filter: blur(5px);
        }

        .glass-card {
            background: var(--glass-bg);
            backdrop-filter: blur(12px);
            border: 1px solid var(--glass-border);
            border-radius: 32px;
            padding: 24px;
            margin-bottom: 20px;
            transition: transform 0.2s, box-shadow 0.2s;
            box-shadow: var(--card-shadow);
        }
        .glass-card:hover {
            transform: translateY(-2px);
        }

        .counter-section {
            text-align: center;
        }
        .count-number {
            font-size: 110px;
            font-weight: 800;
            margin: 20px 0;
            transition: all 0.2s ease;
            letter-spacing: -2px;
        }
        .count-number.safe { color: var(--green); text-shadow: 0 0 20px rgba(16,185,129,0.3); }
        .count-number.warning { color: var(--orange); text-shadow: 0 0 20px rgba(245,158,11,0.3); }
        .count-number.danger { color: var(--red); text-shadow: 0 0 20px rgba(239,68,68,0.3); animation: pulse 1s infinite; }

        @keyframes pulse {
            0%, 100% { opacity: 1; }
            50% { opacity: 0.7; }
        }

        .btn-group {
            display: flex;
            gap: 12px;
            justify-content: center;
            flex-wrap: wrap;
        }
        .btn {
            border: none;
            border-radius: 60px;
            padding: 14px 24px;
            font-weight: 700;
            font-size: 18px;
            cursor: pointer;
            transition: all 0.2s;
            backdrop-filter: blur(4px);
        }
        .btn-primary {
            background: linear-gradient(135deg, var(--green), #059669);
            color: white;
            box-shadow: 0 4px 15px rgba(16,185,129,0.3);
        }
        .btn-half {
            background: linear-gradient(135deg, var(--orange), #d97706);
            color: white;
        }
        .btn-custom {
            background: linear-gradient(135deg, var(--purple), #7c3aed);
            color: white;
        }
        .btn-reset {
            background: rgba(239,68,68,0.2);
            border: 1px solid var(--red);
            color: var(--red);
        }
        .btn-danger {
            background: rgba(239,68,68,0.15);
            border: 1px solid var(--red);
            color: var(--red);
            font-size: 14px;
            padding: 10px 20px;
        }

        .month-selector {
            display: flex;
            gap: 12px;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            margin-bottom: 16px;
        }
        .month-dropdown {
            background: rgba(255,255,255,0.1);
            border: 1px solid var(--glass-border);
            border-radius: 60px;
            padding: 10px 20px;
            color: var(--text);
            font-size: 16px;
            cursor: pointer;
            flex: 1;
        }
        .month-dropdown option {
            background: #1e1b4b;
        }
        .month-stats {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 12px;
            margin-top: 16px;
        }
        .month-stat-card {
            background: rgba(255,255,255,0.05);
            border-radius: 20px;
            padding: 16px;
            text-align: center;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 14px;
            margin-top: 10px;
        }
        .stat-item {
            background: rgba(255,255,255,0.05);
            border-radius: 24px;
            padding: 16px;
            text-align: center;
            transition: 0.2s;
        }
        .stat-label {
            font-size: 13px;
            text-transform: uppercase;
            letter-spacing: 1px;
            opacity: 0.6;
        }
        .stat-value {
            font-size: 28px;
            font-weight: 700;
            margin-top: 6px;
        }

        .timeline-list {
            max-height: 280px;
            overflow-y: auto;
            padding-right: 6px;
        }
        .timeline-item {
            display: flex;
            justify-content: space-between;
            align-items: center;
            padding: 14px 0;
            border-bottom: 1px solid var(--glass-border);
        }
        .timeline-badge {
            display: flex;
            align-items: center;
            gap: 12px;
            flex-wrap: wrap;
        }
        .timeline-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background: var(--green);
            box-shadow: 0 0 8px var(--green);
        }
        .timeline-price {
            font-size: 12px;
            opacity: 0.7;
            background: rgba(139,92,246,0.2);
            padding: 2px 8px;
            border-radius: 20px;
        }
        .timeline-time {
            font-size: 12px;
            opacity: 0.5;
        }

        canvas {
            max-height: 250px;
            margin-top: 10px;
        }

        .timeline-list::-webkit-scrollbar {
            width: 4px;
        }
        .timeline-list::-webkit-scrollbar-track {
            background: rgba(255,255,255,0.05);
            border-radius: 10px;
        }
        .timeline-list::-webkit-scrollbar-thumb {
            background: var(--purple);
            border-radius: 10px;
        }

        .footer {
            text-align: center;
            font-size: 12px;
            opacity: 0.4;
            margin-top: 24px;
        }

        .reset-all-btn {
            margin-top: 12px;
            text-align: center;
        }

        @media (max-width: 500px) {
            .stats-grid { grid-template-columns: 1fr 1fr; }
            .count-number { font-size: 80px; }
            .btn { padding: 12px 20px; font-size: 16px; }
            .glass-card { padding: 18px; }
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚬 Smoke Tracker</h1>
            <div style="display: flex; gap: 10px;">
                <div class="date-badge" id="todayDate"></div>
                <button class="theme-btn" onclick="toggleTheme()">🌓 Theme</button>
            </div>
        </div>

        <!-- Main counter card -->
        <div class="glass-card counter-section">
            <div id="count" class="count-number safe">0</div>
            <div class="btn-group">
                <button class="btn btn-primary" onclick="addQuickSmoke(1)">+1 🚬 (₹10)</button>
                <button class="btn btn-half" onclick="addQuickSmoke(0.5)">+0.5 🔥 (₹5)</button>
                <button class="btn btn-custom" onclick="showCustomPriceModal()">💸 Custom Price</button>
                <button class="btn btn-reset" onclick="resetToday()">Reset ↻</button>
            </div>
        </div>

        <!-- Monthly View Section -->
        <div class="glass-card">
            <div class="month-selector">
                <select id="monthSelector" class="month-dropdown" onchange="changeMonth()"></select>
                <button class="btn" style="background: var(--blue); padding: 10px 20px;" onclick="showCurrentMonth()">📅 This Month</button>
            </div>
            <div class="month-stats">
                <div class="month-stat-card">
                    <div class="stat-label">Month Total</div>
                    <div class="stat-value" id="monthTotalCigs">0</div>
                </div>
                <div class="month-stat-card">
                    <div class="stat-label">Month Spent</div>
                    <div class="stat-value" id="monthTotalMoney">₹0</div>
                </div>
            </div>
            <div style="margin-top: 16px;">
                <canvas id="monthlyChart"></canvas>
            </div>
        </div>

        <!-- Today's Stats -->
        <div class="glass-card">
            <div style="font-weight: 600; margin-bottom: 16px;">📊 Today's Stats</div>
            <div class="stats-grid">
                <div class="stat-item"><div class="stat-label">Today</div><div class="stat-value" id="todayTotal">0</div></div>
                <div class="stat-item"><div class="stat-label">Money Today</div><div class="stat-value" id="moneyToday">₹0</div></div>
                <div class="stat-item"><div class="stat-label">Weekly Avg</div><div class="stat-value" id="weeklyAvg">0</div></div>
                <div class="stat-item"><div class="stat-label">Total Spent</div><div class="stat-value" id="totalSpent">₹0</div></div>
                <div class="stat-item"><div class="stat-label">Lifetime Cigs</div><div class="stat-value" id="lifeTotal">0</div></div>
            </div>
        </div>

        <!-- Today's Timeline -->
        <div class="glass-card">
            <div style="font-weight: 600; margin-bottom: 12px;">⏱ Today's Log</div>
            <div id="timeline" class="timeline-list"></div>
        </div>

        <!-- Backup & Reset -->
        <div class="glass-card">
            <div style="font-weight: 600; margin-bottom: 16px;">💾 Data Management</div>
            <div style="display: flex; gap: 12px; flex-wrap: wrap;">
                <button class="btn" style="background: var(--blue); color: white; flex:1;" onclick="exportData()">⬇ Export</button>
                <button class="btn" style="background: var(--purple); color: white; flex:1;" onclick="importData()">⬆ Import</button>
            </div>
            <div class="reset-all-btn">
                <button class="btn btn-danger" onclick="resetAllData()">⚠️ RESET ALL DATA</button>
            </div>
            <input type="file" id="fileInput" hidden>
        </div>

        <div class="footer">Smoke Tracker Pro • Siri: "Smoked a cigarette" or "Smoked half a cigarette"</div>
    </div>

    <!-- Price Modal -->
    <div id="priceModal" class="modal" style="display:none; position:fixed; top:0; left:0; width:100%; height:100%; background:rgba(0,0,0,0.7); backdrop-filter:blur(8px); z-index:1000; justify-content:center; align-items:center;">
        <div class="modal-content" style="background:var(--glass-bg); backdrop-filter:blur(20px); border:1px solid var(--glass-border); border-radius:40px; padding:28px; width:90%; max-width:340px; text-align:center;">
            <h3>💸 Select Cigarette Price</h3>
            <div style="display:grid; grid-template-columns:repeat(3,1fr); gap:12px; margin:24px 0;">
                <button class="price-btn" style="background:rgba(255,255,255,0.1); border:1px solid var(--glass-border); border-radius:60px; padding:14px; font-size:18px; font-weight:700; cursor:pointer; color:var(--text);" onclick="addCustomPrice(1,15)">₹15</button>
                <button class="price-btn" onclick="addCustomPrice(1,20)">₹20</button>
                <button class="price-btn" onclick="addCustomPrice(1,25)">₹25</button>
                <button class="price-btn" onclick="addCustomPrice(1,30)">₹30</button>
                <button class="price-btn" onclick="addCustomPrice(1,50)">₹50</button>
                <button class="price-btn" onclick="addCustomPrice(1,100)">₹100</button>
            </div>
            <div style="display:flex; gap:10px; margin-top:16px;">
                <input type="number" id="customPrice" placeholder="Custom amount (₹)" step="1" min="1" style="flex:1; padding:12px; border-radius:60px; border:1px solid var(--glass-border); background:rgba(255,255,255,0.1); color:var(--text); font-size:16px; text-align:center;">
                <button class="btn btn-primary" style="padding:12px 20px;" onclick="addCustomPriceFromInput()">Add</button>
            </div>
            <button class="btn modal-close" style="background:var(--red); margin-top:16px;" onclick="closeModal()">Cancel</button>
        </div>
    </div>

    <script>
        const DEFAULT_PRICE = 10;
        const STORAGE_KEY = "smokeTrackerProDataV6";
        const today = new Date().toISOString().split("T")[0];
        let currentMonth = today.slice(0,7);
        let monthlyChart = null;

        document.getElementById("todayDate").innerText = new Date().toDateString();

        let smokeData = JSON.parse(localStorage.getItem(STORAGE_KEY)) || {};
        if (!smokeData[today]) {
            smokeData[today] = { total: 0, entries: [], totalMoney: 0 };
        }
        if (smokeData[today].totalMoney === undefined) {
            smokeData[today].totalMoney = 0;
        }

        // ========== SIRI URL LISTENER ==========
        function checkSiriCommand() {
            const urlParams = new URLSearchParams(window.location.search);
            const addValue = urlParams.get('add');
            
            if (addValue === '1') {
                // Remove the parameter from URL without refreshing
                window.history.replaceState({}, document.title, window.location.pathname);
                addQuickSmoke(1);
                return true;
            } else if (addValue === '0.5') {
                window.history.replaceState({}, document.title, window.location.pathname);
                addQuickSmoke(0.5);
                return true;
            }
            return false;
        }
        // =====================================

        function saveData() {
            localStorage.setItem(STORAGE_KEY, JSON.stringify(smokeData));
            updateMonthSelector();
            if (currentMonth === today.slice(0,7)) {
                updateUI();
            } else {
                updateMonthlyView();
            }
        }

        function addQuickSmoke(amount) {
            const totalPrice = amount * DEFAULT_PRICE;
            addSmokeEntry(amount, DEFAULT_PRICE, totalPrice);
        }

        function showCustomPriceModal() {
            document.getElementById("priceModal").style.display = "flex";
            document.getElementById("customPrice").value = "";
        }

        function addCustomPrice(amount, pricePerUnit) {
            addSmokeEntry(amount, pricePerUnit, amount * pricePerUnit);
            closeModal();
        }

        function addCustomPriceFromInput() {
            const customPrice = parseFloat(document.getElementById("customPrice").value);
            if (isNaN(customPrice) || customPrice <= 0) {
                alert("Please enter a valid price (₹)");
                return;
            }
            addSmokeEntry(1, customPrice, customPrice);
            closeModal();
        }

        function addSmokeEntry(amount, pricePerUnit, totalMoney) {
            if (!smokeData[today]) {
                smokeData[today] = { total: 0, entries: [], totalMoney: 0 };
            }
            smokeData[today].total += amount;
            smokeData[today].totalMoney = (smokeData[today].totalMoney || 0) + totalMoney;
            smokeData[today].entries.unshift({
                amount: amount,
                price: pricePerUnit,
                totalPrice: totalMoney,
                time: new Date().toLocaleTimeString([], { hour: '2-digit', minute: '2-digit' }),
                timestamp: Date.now()
            });
            saveData();
            updateUI();
            triggerHaptic();
        }

        function triggerHaptic() {
            if (navigator.vibrate) navigator.vibrate(50);
        }

        function resetToday() {
            if (confirm("⚠️ Reset ONLY today's data? This cannot be undone.")) {
                smokeData[today] = { total: 0, entries: [], totalMoney: 0 };
                saveData();
                updateUI();
            }
        }

        function resetAllData() {
            if (confirm("⚠️⚠️⚠️ THIS WILL DELETE EVERYTHING! All your smoking history will be gone forever. Are you ABSOLUTELY sure?")) {
                smokeData = {};
                smokeData[today] = { total: 0, entries: [], totalMoney: 0 };
                saveData();
                updateUI();
                alert("All data has been reset.");
            }
        }

        function closeModal() {
            document.getElementById("priceModal").style.display = "none";
        }

        function updateMonthSelector() {
            const months = new Set();
            Object.keys(smokeData).forEach(date => {
                months.add(date.slice(0,7));
            });
            const sortedMonths = Array.from(months).sort().reverse();
            const selector = document.getElementById("monthSelector");
            selector.innerHTML = sortedMonths.map(month => {
                const [year, monthNum] = month.split('-');
                const monthName = new Date(year, monthNum-1).toLocaleString('default', { month: 'long' });
                return `<option value="${month}" ${month === currentMonth ? 'selected' : ''}>${monthName} ${year}</option>`;
            }).join('');
            if (sortedMonths.length === 0) {
                selector.innerHTML = `<option value="${today.slice(0,7)}">${new Date().toLocaleString('default', { month: 'long' })}</option>`;
            }
        }

        function changeMonth() {
            currentMonth = document.getElementById("monthSelector").value;
            updateMonthlyView();
        }

        function showCurrentMonth() {
            currentMonth = today.slice(0,7);
            document.getElementById("monthSelector").value = currentMonth;
            updateMonthlyView();
        }

        function updateMonthlyView() {
            const datesInMonth = Object.keys(smokeData).filter(date => date.startsWith(currentMonth)).sort();
            let monthTotal = 0;
            let monthMoney = 0;
            
            datesInMonth.forEach(date => {
                monthTotal += smokeData[date].total || 0;
                monthMoney += smokeData[date].totalMoney || 0;
            });

            document.getElementById("monthTotalCigs").innerText = monthTotal;
            document.getElementById("monthTotalMoney").innerText = "₹" + Math.round(monthMoney);

            const labels = datesInMonth.map(d => d.substring(5));
            const values = datesInMonth.map(d => smokeData[d].total || 0);

            if (monthlyChart) monthlyChart.destroy();
            const ctx = document.getElementById("monthlyChart").getContext("2d");
            monthlyChart = new Chart(ctx, {
                type: 'bar',
                data: {
                    labels: labels,
                    datasets: [{
                        label: 'Cigarettes per day',
                        data: values,
                        backgroundColor: 'rgba(139, 92, 246, 0.6)',
                        borderColor: '#8b5cf6',
                        borderWidth: 1,
                        borderRadius: 8
                    }]
                },
                options: {
                    responsive: true,
                    maintainAspectRatio: true,
                    plugins: {
                        legend: { labels: { color: getComputedStyle(document.body).getPropertyValue('--text').trim() } }
                    },
                    scales: {
                        x: { ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-dim').trim(), maxRotation: 45, minRotation: 45 } },
                        y: { ticks: { color: getComputedStyle(document.body).getPropertyValue('--text-dim').trim() }, beginAtZero: true }
                    }
                }
            });
        }

        function updateUI() {
            const total = smokeData[today]?.total || 0;
            const totalMoney = smokeData[today]?.totalMoney || 0;
            const countEl = document.getElementById("count");
            countEl.innerText = total;
            countEl.className = "count-number";
            if (total <= 3) countEl.classList.add("safe");
            else if (total <= 7) countEl.classList.add("warning");
            else countEl.classList.add("danger");

            document.getElementById("todayTotal").innerText = total;
            document.getElementById("moneyToday").innerText = "₹" + Math.round(totalMoney);
            updateLifetimeStats();
            updateTimeline();
            
            if (currentMonth === today.slice(0,7)) {
                updateMonthlyView();
            }
        }

        function updateLifetimeStats() {
            const dates = Object.keys(smokeData);
            let lifeTotal = 0;
            let lifeMoney = 0;
            dates.forEach(date => {
                lifeTotal += smokeData[date].total || 0;
                lifeMoney += smokeData[date].totalMoney || 0;
            });
            const last7Days = dates.slice(-7);
            let weeklyTotal = 0;
            last7Days.forEach(d => weeklyTotal += smokeData[d].total || 0);
            const weeklyAvg = (weeklyTotal / 7).toFixed(1);
            
            document.getElementById("weeklyAvg").innerText = weeklyAvg;
            document.getElementById("lifeTotal").innerText = lifeTotal;
            document.getElementById("totalSpent").innerText = "₹" + Math.round(lifeMoney);
        }

        function updateTimeline() {
            const timeline = document.getElementById("timeline");
            const entries = smokeData[today]?.entries;
            if (!entries || entries.length === 0) {
                timeline.innerHTML = `<div class="timeline-item"><div class="timeline-badge">✨ No cigarettes logged today</div></div>`;
                return;
            }
            timeline.innerHTML = entries.slice(0,30).map(entry => `
                <div class="timeline-item">
                    <div class="timeline-badge">
                        <div class="timeline-dot"></div>
                        <strong>+${entry.amount}</strong>
                        <span class="timeline-price">₹${entry.price}</span>
                    </div>
                    <div class="timeline-time">${entry.time}</div>
                </div>
            `).join('');
        }

        function exportData() {
            const dataStr = JSON.stringify(smokeData, null, 2);
            const blob = new Blob([dataStr], { type: "application/json" });
            const url = URL.createObjectURL(blob);
            const a = document.createElement("a");
            a.href = url;
            a.download = `smoke-backup-${today}.json`;
            a.click();
            URL.revokeObjectURL(url);
        }

        function importData() {
            document.getElementById("fileInput").click();
        }

        document.getElementById("fileInput").addEventListener("change", function(e) {
            const file = e.target.files[0];
            if (!file) return;
            const reader = new FileReader();
            reader.onload = function(event) {
                try {
                    const imported = JSON.parse(event.target.result);
                    smokeData = imported;
                    if (!smokeData[today]) {
                        smokeData[today] = { total: 0, entries: [], totalMoney: 0 };
                    }
                    saveData();
                    updateUI();
                    alert("✅ Backup restored successfully!");
                } catch {
                    alert("❌ Invalid backup file");
                }
            };
            reader.readAsText(file);
        });

        function toggleTheme() {
            document.body.classList.toggle('light');
            if (monthlyChart) updateMonthlyView();
        }

        window.onclick = function(event) {
            const modal = document.getElementById("priceModal");
            if (event.target === modal) closeModal();
        }

        // Run Siri check AFTER everything is loaded
        updateMonthSelector();
        updateUI();
        checkSiriCommand();  // This listens for ?add=1 or ?add=0.5
    </script>
</body>
</html>
