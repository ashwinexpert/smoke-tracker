<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Smoke Tracker Pro</title>
<script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
<style>
*{
margin:0;
padding:0;
box-sizing:border-box;
}
body{
font-family:Arial,sans-serif;
background:
linear-gradient(135deg,#081223,#111c44);
color:white;
min-height:100vh;
padding:20px;
}
.container{
max-width:520px;
margin:auto;
}
.title{
text-align:center;
margin-bottom:20px;
}
.title h1{
font-size:40px;
margin-bottom:8px;
}
.title p{
opacity:0.7;
}
.glass{
background:rgba(255,255,255,0.08);
backdrop-filter:blur(15px);
border:1px solid rgba(255,255,255,0.08);
padding:20px;
border-radius:25px;
margin-bottom:20px;
box-shadow:0 0 25px rgba(0,0,0,0.25);
}
.count{
font-size:90px;
font-weight:bold;
text-align:center;
margin:20px 0;
transition:0.3s;
}
.safe{
color:#00e676;
}
.warning{
color:#ff9800;
}
.danger{
color:#ff1744;
}
.buttons{
display:flex;
gap:10px;
}
button{
flex:1;
padding:15px;
border:none;
border-radius:16px;
font-size:18px;
font-weight:bold;
cursor:pointer;
color:white;
transition:0.2s;
}
button:hover{
transform:scale(1.03);
}
.green{
background:#00c853;
}
.orange{
background:#ff9800;
}
.red{
background:#ff1744;
}
.stats{
display:grid;
grid-template-columns:1fr 1fr;
gap:12px;
margin-top:10px;
}
.card{
background:rgba(255,255,255,0.05);
padding:18px;
border-radius:18px;
text-align:center;
}
.card h2{
margin-top:10px;
font-size:28px;
}
.timeline{
max-height:260px;
overflow-y:auto;
margin-top:15px;
}
.item{
display:flex;
justify-content:space-between;
padding:14px;
border-bottom:1px solid rgba(255,255,255,0.08);
}
.small{
opacity:0.6;
font-size:13px;
}
.footer{
text-align:center;
margin-top:20px;
opacity:0.5;
font-size:13px;
}
canvas{
margin-top:15px;
}
</style>
</head>
<body>
<div class="container">
<div class="title">
<h1>🚬 Smoke Tracker Pro</h1>
<p id="date"></p>
</div>
<div class="glass">
<div id="count" class="count safe">0</div>
<div class="buttons">
<button class="green" onclick="addSmoke(1)">
+1
</button>
<button class="orange" onclick="addSmoke(0.5)">
+0.5
</button>
<button class="red" onclick="resetToday()">
Reset
</button>
</div>
</div>
<div class="glass">
<h2>📊 Analytics</h2>
<div class="stats">
<div class="card">
Today
<h2 id="todayTotal">0</h2>
</div>
<div class="card">
Weekly Avg
<h2 id="weeklyAvg">0</h2>
</div>
<div class="card">
Money Today
<h2 id="moneyToday">₹0</h2>
</div>
<div class="card">
Monthly Total
<h2 id="monthlyTotal">0</h2>
</div>
</div>
</div>
<div class="glass">
<h2>📈 Last 7 Days</h2>
<canvas id="chart"></canvas>
</div>
<div class="glass">
<h2>⏱ Timeline</h2>
<div class="timeline" id="timeline"></div>
</div>
<div class="footer">
Smoke Tracker Pro • Local Storage Enabled
</div>
</div>
<script>
const PRICE_PER_CIG = 10;
const today =
new Date().toISOString().split("T")[0];
document.getElementById("date")
.innerText =
new Date().toDateString();
let smokeData =
JSON.parse(localStorage.getItem("smokeData")) || {};
if(!smokeData[today]){
smokeData[today]={
total:0,
entries:[]
};
saveData();
}
function saveData(){
localStorage.setItem(
"smokeData",
JSON.stringify(smokeData)
);
}
function addSmoke(amount){
smokeData[today].total += amount;
smokeData[today].entries.unshift({
amount:amount,
time:new Date().toLocaleTimeString()
});
saveData();
updateUI();
}
function resetToday(){
if(confirm("Reset today's data?")){
smokeData[today]={
total:0,
entries:[]
};
saveData();
updateUI();
}
}
function updateUI(){
const total =
smokeData[today].total;
const countEl =
document.getElementById("count");
countEl.innerText = total;
countEl.className = "count";
if(total <= 3){
countEl.classList.add("safe");
}
else if(total <= 7){
countEl.classList.add("warning");
}
else{
countEl.classList.add("danger");
}
document.getElementById("todayTotal")
.innerText = total;
document.getElementById("moneyToday")
.innerText =
"₹" + (total * PRICE_PER_CIG);
updateStats();
updateTimeline();
updateChart();
}
function updateStats(){
const dates =
Object.keys(smokeData);
let monthly = 0;
dates.forEach(date=>{
monthly += smokeData[date].total;
});
document.getElementById("monthlyTotal")
.innerText = monthly;
const avg =
(monthly / dates.length || 0)
.toFixed(1);
document.getElementById("weeklyAvg")
.innerText = avg;
}
function updateTimeline(){
const timeline =
document.getElementById("timeline");
timeline.innerHTML = "";
smokeData[today].entries.forEach(entry=>{
timeline.innerHTML += `
<div class="item">
<div>
<strong>+${entry.amount}</strong>
</div>
<div class="small">
${entry.time}
</div>
</div>
`;
});
}
let chart;
function updateChart(){
const labels = [];
const values = [];
const dates =
Object.keys(smokeData)
.slice(-7);
dates.forEach(date=>{
labels.push(date.substring(5));
values.push(smokeData[date].total);
});
if(chart){
chart.destroy();
}
chart = new Chart(
document.getElementById("chart"),
{
type:"line",
data:{
labels:labels,
datasets:[{
label:"Cigarettes",
data:values,
tension:0.4,
fill:true
}]
},
options:{
plugins:{
legend:{
labels:{
color:"white"
}
}
},
scales:{
x:{
ticks:{
color:"white"
}
},
y:{
ticks:{
color:"white"
}
}
}
}
}
);
}
updateUI();
</script>
</body>
</html>
