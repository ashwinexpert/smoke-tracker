<!DOCTYPE html>
<html>
<head>
  <title>Smoke Tracker</title>

  <style>
    body {
      background: #0f172a;
      color: white;
      font-family: Arial;
      text-align: center;
      padding-top: 50px;
    }

    .box {
      background: #1e293b;
      width: 300px;
      margin: auto;
      padding: 30px;
      border-radius: 20px;
    }

    h1 {
      font-size: 32px;
    }

    #count {
      font-size: 70px;
      margin: 20px 0;
      color: #38bdf8;
    }

    button {
      width: 100%;
      padding: 15px;
      margin-top: 10px;
      border: none;
      border-radius: 10px;
      font-size: 18px;
      cursor: pointer;
    }

    .add {
      background: #22c55e;
      color: white;
    }

    .half {
      background: orange;
      color: white;
    }

    .reset {
      background: red;
      color: white;
    }
  </style>
</head>

<body>

  <div class="box">
    <h1>🚬 Smoke Tracker</h1>

    <div id="count">0</div>

    <button class="add" onclick="addOne()">
      +1 Cigarette
    </button>

    <button class="half" onclick="addHalf()">
      +0.5 Cigarette
    </button>

    <button class="reset" onclick="resetCount()">
      Reset Day
    </button>
  </div>

  <script>
    let count = localStorage.getItem("smokeCount") || 0;

    document.getElementById("count").innerText = count;

    function addOne() {
      count = parseFloat(count) + 1;
      updateCount();
    }

    function addHalf() {
      count = parseFloat(count) + 0.5;
      updateCount();
    }

    function resetCount() {
      count = 0;
      updateCount();
    }

    function updateCount() {
      document.getElementById("count").innerText = count;
      localStorage.setItem("smokeCount", count);
    }
  </script>

</body>
</html>
